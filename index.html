<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="OpoTest"/>
<meta name="color-scheme" content="light dark"/>
<script>
  // Modo oscuro: aplica el tema guardado (o el del sistema) antes de pintar
  (function () {
    var oscuro = false;
    try {
      var g = localStorage.getItem('opotest_tema');
      oscuro = g ? g === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {}
    document.documentElement.classList.toggle('dark', oscuro);
  })();
  function alternarTema() {
    var oscuro = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('opotest_tema', oscuro ? 'oscuro' : 'claro'); } catch (e) {}
    var b = document.getElementById('btnTema');
    if (b) { b.title = oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'; }
  }
</script>
<title>OpoTest - Preparación de Oposiciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  /* Neutros fríos, superficies de cristal, acento índigo como marca de OpoTest. */
  :root {
    --fondo: #eceef2;
    --vidrio: rgba(255, 255, 255, .50);
    --vidrio-2: rgba(255, 255, 255, .34);
    --vidrio-fuerte: rgba(255, 255, 255, .86);
    --campo: rgba(255, 255, 255, .72);
    --solido: #f6f7f9;
    --borde-vidrio: rgba(255, 255, 255, .78);
    --brillo: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 -1px 0 rgba(60, 72, 110, .10);
    --sombra-vidrio: 0 12px 36px rgba(40, 52, 90, .14), 0 1px 2px rgba(40, 52, 90, .08);
    --tinta: #18202c;
    --tinta-2: #465162;
    --tinta-3: #647082;
    --linea: rgba(60, 72, 104, .16);
    --linea-2: rgba(60, 72, 104, .38);

    /* Marca OpoTest: índigo */
    --acc: #4f46e5;
    --acc-rgb: 79, 70, 229;
    --acc2: #7c3aed;
    --acc-light: rgba(79, 70, 229, .11);
    --acc-glow: rgba(79, 70, 229, .28);
    --fondo-1: rgba(165, 180, 252, .55);
    --fondo-2: rgba(196, 181, 253, .50);
    --fondo-3: rgba(191, 219, 254, .45);

    /* Estados */
    --ok: #2c7a4b;   --okbg: rgba(44, 122, 75, .13);   --okborder: rgba(44, 122, 75, .32);
    --ko: #b1372d;   --kobg: rgba(177, 55, 45, .13);   --koborder: rgba(177, 55, 45, .32);
    --warn: #9a6200; --warnbg: rgba(154, 98, 0, .13);  --warnborder: rgba(154, 98, 0, .32);

    /* Compatibilidad con nombres antiguos */
    --bg: var(--fondo);
    --card: var(--vidrio);
    --card-elevated: var(--vidrio-fuerte);
    --txt: var(--tinta);
    --mut: var(--tinta-2);
    --line: var(--linea);
    --line-soft: rgba(60, 72, 104, .08);

    /* Radios */
    --radius-sm: 10px;
    --radius: 16px;
    --radius-lg: 22px;

    /* Tipografía */
    --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --serif: ui-serif, 'New York', 'Source Serif 4', Georgia, 'Times New Roman', serif;
  }

  html.dark {
    color-scheme: dark;
    --fondo: #0e1116;
    --vidrio: rgba(30, 34, 46, .56);
    --vidrio-2: rgba(30, 34, 46, .36);
    --vidrio-fuerte: rgba(22, 25, 36, .90);
    --campo: rgba(8, 10, 18, .55);
    --solido: #1a1e29;
    --borde-vidrio: rgba(255, 255, 255, .15);
    --brillo: inset 0 1px 0 rgba(255, 255, 255, .13), inset 0 -1px 0 rgba(0, 0, 0, .28);
    --sombra-vidrio: 0 14px 40px rgba(0, 0, 0, .45);
    --tinta: #e9edf2;
    --tinta-2: #b8c1ce;
    --tinta-3: #929dac;
    --linea: rgba(190, 205, 235, .16);
    --linea-2: rgba(190, 205, 235, .36);

    --acc: #a5b4fc;
    --acc-rgb: 165, 180, 252;
    --acc2: #c4b5fd;
    --acc-light: rgba(165, 180, 252, .16);
    --acc-glow: rgba(165, 180, 252, .30);
    --fondo-1: rgba(79, 70, 229, .38);
    --fondo-2: rgba(120, 40, 180, .30);
    --fondo-3: rgba(56, 100, 200, .22);

    --ok: #6fcf97;   --okbg: rgba(111, 207, 151, .16);   --okborder: rgba(111, 207, 151, .32);
    --ko: #f08a80;   --kobg: rgba(240, 138, 128, .16);   --koborder: rgba(240, 138, 128, .32);
    --warn: #e0b45a; --warnbg: rgba(224, 180, 90, .16);  --warnborder: rgba(224, 180, 90, .32);

    --line-soft: rgba(190, 205, 235, .08);
  }

  * { box-sizing: border-box; }
  html { background: var(--fondo); }
  html, body {
    margin: 0;
    min-height: 100vh;
    font: 400 15px/1.55 var(--font-family);
    color: var(--tinta);
    -webkit-font-smoothing: antialiased;
  }
  body {
    background: var(--fondo);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(52rem 38rem at 8% -8%, var(--fondo-1), transparent 62%),
      radial-gradient(46rem 36rem at 100% 8%, var(--fondo-2), transparent 60%),
      radial-gradient(48rem 34rem at 55% 108%, var(--fondo-3), transparent 62%);
  }
  #particulas {
    position: fixed;
    inset: 0;
    z-index: -1;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #particulas { display: none; }
  }
  h1, h2, h3, h4, p { margin: 0; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Cristal: superficie translúcida con brillo interior y borde de luz diagonal */
  .barra, .vidrio,
  .card, .session-card, .pr-top, .qcard, .hero-card {
    background: var(--vidrio);
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    backdrop-filter: blur(22px) saturate(170%);
    box-shadow: var(--brillo), var(--sombra-vidrio);
  }
  .card, .session-card, .pr-top, .qcard, .hero-card {
    position: relative;
    border: 1px solid var(--borde-vidrio);
  }
  .card::before, .session-card::before, .pr-top::before, .qcard::before, .hero-card::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    padding: 1px;
    pointer-events: none;
    z-index: 1;
    background: linear-gradient(135deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .12) 38%, rgba(255, 255, 255, .06) 62%, rgba(255, 255, 255, .7));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    opacity: .55;
  }
  html.dark .card::before, html.dark .session-card::before, html.dark .pr-top::before,
  html.dark .qcard::before, html.dark .hero-card::before { opacity: .22; }

  /* Barra superior */
  header.barra {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px 10px;
    border-bottom: 1px solid var(--borde-vidrio);
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .brand-logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    padding: 6px;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    box-shadow: 0 2px 8px var(--acc-glow);
    object-fit: cover;
    transition: transform .2s ease;
  }
  .brand-wrap:hover .brand-logo {
    transform: scale(1.05) rotate(-2deg);
  }
  .brand-text { display: flex; flex-direction: column; }
  .brand-title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.15;
    background: linear-gradient(135deg, var(--txt), var(--acc));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand-tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--mut);
    letter-spacing: 0.1px;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Main */
  main {
    position: relative;
    z-index: 1;
    padding: 20px 16px;
    max-width: 700px;
    margin: 0 auto;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 54px);
    animation: fade .3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* Botones */
  button, .btn {
    font-family: inherit;
    font-weight: 600;
    border: 1px solid var(--linea-2);
    background: var(--vidrio-2);
    color: var(--txt);
    border-radius: 14px;
    padding: 12px 18px;
    cursor: pointer;
    min-height: 46px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14.5px;
    transition: background-color .15s, border-color .15s, color .15s, transform .15s, box-shadow .15s;
    box-shadow: var(--brillo);
    text-decoration: none;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  button:hover, .btn:hover { background: var(--campo); }
  button:active { transform: scale(0.97); }
  button:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none !important;
  }
  button.primary {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .30), rgba(255, 255, 255, 0) 55%),
      linear-gradient(135deg, var(--acc), var(--acc2));
    border-color: rgba(255, 255, 255, .35);
    color: #ffffff;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .35),
      0 4px 14px var(--acc-glow);
  }
  button.primary:hover {
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .35),
      0 6px 20px var(--acc-glow);
    transform: translateY(-1px);
  }
  button.secondary {
    background: var(--acc-light);
    border-color: rgba(var(--acc-rgb), .30);
    color: var(--acc);
  }
  button.secondary:hover {
    background: var(--acc-light);
    border-color: var(--acc);
  }
  button.danger {
    color: var(--ko);
    background: var(--kobg);
    border-color: var(--koborder);
  }
  button.danger:hover {
    background: var(--ko);
    color: #ffffff;
  }
  button.small, .btn.small {
    min-height: 36px;
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 10px;
  }
  button.nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--vidrio-2);
    border: 1px solid var(--linea-2);
    color: var(--txt);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    min-height: 32px;
    box-shadow: var(--brillo);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  button.nav-btn:hover {
    border-color: var(--acc);
    color: var(--acc);
    background: var(--acc-light);
  }
  button.nav-btn-icon {
    width: 32px;
    padding: 0;
    min-height: 32px;
  }
  button.nav-btn-icon svg { width: 16px; height: 16px; }
  .tema-sol { display: none; }
  html.dark .tema-sol { display: inline-block; }
  html.dark .tema-luna { display: none; }

  /* Filas y utilidades */
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .row.stretch > * { flex: 1; }
  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .meta { color: var(--mut); font-size: 13px; }
  .flex-1 { flex: 1; }
  .mt-6 { margin-top: 6px; }

  /* Checkboxes (clase reutilizable) */
  .cb {
    width: 18px;
    height: 18px;
    accent-color: var(--acc);
    flex: none;
    cursor: pointer;
  }
  .cb-label {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--txt);
    text-transform: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: normal;
    margin: 4px 0;
    cursor: pointer;
  }

  /* Tarjetas */
  .card {
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover { border-color: rgba(var(--acc-rgb), .35); }

  .hero-card {
    border-radius: var(--radius-lg);
    padding: 24px;
    background:
      linear-gradient(145deg, transparent 0%, var(--acc-light) 100%),
      var(--vidrio);
    overflow: hidden;
  }
  .hero-content {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .hero-logo-box {
    width: 68px;
    height: 68px;
    flex-shrink: 0;
    border-radius: 18px;
    padding: 3px;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    box-shadow: 0 6px 20px var(--acc-glow);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-logo-img {
    width: 100%;
    height: 100%;
    padding: 10px;
    border-radius: 15px;
    color: #ffffff;
  }
  .hero-title {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 4px;
    letter-spacing: -0.4px;
    color: var(--txt);
  }
  .hero-desc {
    color: var(--mut);
    font-size: 13.5px;
    line-height: 1.45;
  }

  /* Estadísticas */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-pill {
    background: var(--vidrio-2);
    border: 1px solid var(--linea);
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: var(--brillo);
    transition: transform .15s ease, border-color .15s ease;
  }
  .stat-pill:hover { transform: translateY(-2px); border-color: var(--acc); }
  .stat-val { font-size: 22px; font-weight: 800; color: var(--txt); line-height: 1.1; }
  .stat-label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--mut);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  /* Opciones de respuesta */
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    margin: 10px 0;
    padding: 14px 16px;
    white-space: normal;
    font-weight: 500;
    border-radius: var(--radius);
    line-height: 1.45;
    font-size: 15px;
    border: 1.5px solid var(--line);
    background: var(--campo);
    color: var(--txt);
    transition: background-color .18s, border-color .18s, transform .18s, box-shadow .18s;
    box-shadow: var(--brillo);
    position: relative;
    min-height: 0;
    cursor: pointer;
  }
  .opt:not(:disabled):hover {
    border-color: var(--acc);
    background: var(--acc-light);
    transform: translateX(3px);
    box-shadow: 0 4px 12px var(--acc-glow);
  }
  .opt-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--campo);
    border: 1px solid var(--line);
    color: var(--acc);
    font-weight: 800;
    font-size: 14px;
    flex-shrink: 0;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .opt:hover .opt-badge { background: var(--acc); color: #ffffff; border-color: var(--acc); }
  .opt-text { flex: 1; }
  .opt.ok {
    background: var(--okbg);
    border-color: var(--ok);
    color: var(--txt);
    box-shadow: 0 4px 14px rgba(44, 122, 75, .15);
  }
  .opt.ok .opt-badge { background: var(--ok); color: #ffffff; border-color: var(--ok); }
  .opt.ko {
    background: var(--kobg);
    border-color: var(--ko);
    color: var(--txt);
    box-shadow: 0 4px 14px rgba(177, 55, 45, .15);
  }
  .opt.ko .opt-badge { background: var(--ko); color: #ffffff; border-color: var(--ko); }

  /* Cabecera de práctica */
  .pr-top {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border-radius: var(--radius);
  }
  .pr-txt { flex: 1; }
  .pr-count { font-size: 24px; font-weight: 800; line-height: 1; letter-spacing: -0.4px; }
  .pr-count span { font-size: 15px; color: var(--mut); font-weight: 600; }
  .pr-score-chips { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .chip.ok { background: var(--okbg); color: var(--ok); }
  .chip.ko { background: var(--kobg); color: var(--ko); }
  .chip.theme { background: var(--acc-light); color: var(--acc); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 700;
    border-radius: 999px;
    padding: 3px 9px;
    background: var(--line-soft);
    color: var(--mut);
    border: 1px solid var(--linea);
  }
  .badge.warn { background: var(--warnbg); color: var(--warn); border-color: var(--warnborder); }
  .badge.ok { background: var(--okbg); color: var(--ok); border-color: var(--okborder); }
  .badge.primary { background: var(--acc-light); color: var(--acc); border-color: rgba(var(--acc-rgb), .30); }

  /* Ficha de pregunta */
  .qcard { padding: 24px 22px; border-radius: var(--radius-lg); }
  .qcard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 8px;
  }
  .enun {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: -0.2px;
    margin: 4px 0 16px;
    color: var(--txt);
  }

  /* Feedback */
  .feedback {
    margin-top: 14px;
    padding: 14px 18px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 14.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: pop .25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }
  .feedback.good { background: var(--okbg); color: var(--ok); border: 1.5px solid var(--okborder); }
  .feedback.bad { background: var(--kobg); color: var(--ko); border: 1.5px solid var(--koborder); }

  /* Anillos de progreso */
  .ring-bg { fill: none; stroke: var(--linea); stroke-width: 8; }
  .ring-fg { fill: none; stroke: var(--acc); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
  .ring.big .ring-fg { stroke-width: 12; }
  .ring.big .ring-bg { stroke-width: 12; }

  /* Resultado */
  .res { text-align: center; padding: 32px 20px; border-radius: var(--radius-lg); }
  .res-wrap { position: relative; width: 148px; height: 148px; margin: 0 auto 12px; }
  .res-pct {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
