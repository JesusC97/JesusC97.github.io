<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f3f5fb;--card:#ffffff;--txt:#1b2236;--mut:#6b7389;--line:#e3e7f1;
  --acc:#5b5bd6;--acc2:#7c5cf0;--ok:#16a34a;--okbg:#e8f8ee;--ko:#dc2626;--kobg:#fdeaea;
  --warn:#9a6700;--warnbg:#fff6dc;--shadow:0 1px 2px rgba(20,25,50,.06),0 4px 14px rgba(20,25,50,.06);
  --radius:16px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1219;--card:#181d28;--txt:#e7eaf3;--mut:#97a0b5;--line:#262d3b;
  --acc:#8b8bf5;--acc2:#a78bfa;--ok:#4ade80;--okbg:#14291d;--ko:#f87171;--kobg:#331a1d;
  --warn:#f5c264;--warnbg:#2e2612;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 2px 12px rgba(91,91,214,.25)}
header h1{font-size:18px;font-weight:700;margin:0;flex:1;letter-spacing:.2px}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;box-shadow:none}
main{padding:16px;max-width:720px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px);animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;
  padding:11px 16px;cursor:pointer;min-height:44px;display:inline-block;transition:transform .08s ease,background .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(91,91,214,.3)}
button.danger{color:var(--ko)}
button.small{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
button:disabled{opacity:.4;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;white-space:normal;font-weight:500;border-radius:14px;line-height:1.4}
.opt:not(:disabled):hover{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,91,214,.12)}
.opt b{color:var(--acc);margin-right:4px}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--txt)}
.opt.ok b{color:var(--ok)}
.opt.ko{background:var(--kobg);border-color:var(--ko);color:var(--txt)}
.opt.ko b{color:var(--ko)}
.meta{color:var(--mut);font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--line);color:var(--mut);margin:2px 4px 2px 0}
.badge.warn{background:var(--warnbg);color:var(--warn)}
select,input[type=text],textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--txt);outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,91,214,.15)}
textarea{min-height:80px;resize:vertical}
label{display:block;margin:12px 0 6px;font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.qitem{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;font-weight:400}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0 14px}
.bar div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s ease}
.enun{font-size:17px;font-weight:600;margin:4px 0 10px;line-height:1.45}
.hidden{display:none}

.ico{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.qcard{padding:20px}
.enter{animation:slide .32s cubic-bezier(.2,.7,.2,1)}
@keyframes slide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.pr-top{display:flex;align-items:center;gap:14px;padding:14px 16px}
.pr-txt{flex:1}
.pr-count{font-size:26px;font-weight:800;line-height:1}
.pr-count span{font-size:16px;color:var(--mut);font-weight:600}
.pr-badges{display:flex;flex-direction:column;align-items:flex-end}
.ring-bg{fill:none;stroke:var(--line);stroke-width:7}
.ring-fg{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring.big .ring-fg{stroke-width:10}
.ring.big .ring-bg{stroke-width:10}
.feedback{margin-top:10px;padding:12px 14px;border-radius:12px;font-weight:600}
.feedback.good{background:var(--okbg);color:var(--ok)}
.feedback.bad{background:var(--kobg);color:var(--ko)}
.res{text-align:center;padding:24px 16px}
.res-wrap{position:relative;width:140px;height:140px;margin:0 auto}
.res-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800}
.res .res-msg{font-weight:600;margin:14px 0 4px;font-size:18px}
.tema-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.tema-row span:first-child{width:72px;font-size:14px;font-weight:600}
.tema-row .bar{flex:1;margin:0}
.tema-row .meta{width:44px;text-align:right}
.enun{font-size:19px;font-weight:600;line-height:1.65;letter-spacing:.1px;margin:4px 0 14px}
</style>
</head>
<body>
<header>
  <h1 id="title">Test</h1>
  <button id="btnInicio" class="small">Inicio</button>
</header>
<main id="app"></main>

<script>
const KQ='test-app-v1', KS='test-app-sesiones-v1';
const VERSION='Actualizada el 17/10/2026';
let Q=[], SES=[];
let view='home', actual=null, sess=null, editing=null, form=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function saveQ(){try{localStorage.setItem(KQ,JSON.stringify(Q));}catch(e){}}
function saveS(){try{localStorage.setItem(KS,JSON.stringify(SES));}catch(e){}}
function load(){
  try{const q=localStorage.getItem(KQ); if(q) Q=JSON.parse(q);}catch(e){}
  try{const s=localStorage.getItem(KS); if(s) SES=JSON.parse(s);}catch(e){}
}
function byId(id){return Q.find(q=>q.id===id);}
function sesionById(id){return SES.find(s=>s.id===id);}
function nuevoId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esLimpia(q){return !q.revisar || q.revisar.length===0;}
function estado(q){
  if(q.editada) return {t:'editada',c:''};
  if(!q.correcta) return {t:'sin respuesta',c:'warn'};
  if(q.revisar&&q.revisar.length) return {t:'revisar',c:'warn'};
  return {t:'ok',c:''};
}
function convs(){return [...new Set(Q.map(q=>q.convocatoria))];}
function temasDe(conv){return [...new Set(Q.filter(q=>conv==='all'||q.convocatoria===conv).map(q=>q.tema))].sort((a,b)=>a-b);}
function filtrarPara(s){
  return Q.filter(q=>(s.conv==='all'||q.convocatoria===s.conv)
    &&(s.tema==='all'||String(q.tema)===String(s.tema))
    &&(!s.limpias||esLimpia(q)));
}
function resumenFiltro(s){
  const c=s.conv==='all'?'Todas las convocatorias':s.conv;
  const t=s.tema==='all'?'todos los temas':'tema '+s.tema;
  return `${c} · ${t}${s.limpias?' · solo revisadas':''}`;
}

function go(v){view=v; render(); window.scrollTo(0,0);}
function render(){
  const titulos={home:'Test',sesiones:'Sesiones',sesion:'Sesión',form:'Configurar sesión',practice:'Practicar',edit:'Editar pregunta',list:'Preguntas',datos:'Datos',revisar:'Revisar importación'};
  document.getElementById('title').textContent=titulos[view]||'Test';
  const app=document.getElementById('app');
  const v={revisar:vistaRevision,home:vistaInicio,sesiones:vistaSesiones,sesion:vistaSesion,form:vistaForm,practice:vistaPractica,edit:vistaEditar,list:vistaLista,datos:vistaDatos}[view];
  app.innerHTML=v();
  bind();
}

/* ---------- INICIO ---------- */
function vistaInicio(){
  if(!Q.length) return `<div class="card"><p>Todavía no hay preguntas cargadas.</p>
    <label>Importa el archivo JSON de preguntas</label>
    <input type="file" id="fileIn" accept=".json,application/json">
    <p class="meta">Se guarda en este dispositivo. Solo hace falta importarlo una vez.</p></div>
    <p class="meta" style="text-align:center;margin-top:24px">${VERSION}</p>`;
  return `<div class="card"><p style="margin:0 0 6px"><b>${Q.length}</b> preguntas guardadas en este dispositivo.</p>
    <p class="meta">${SES.length} sesiones creadas</p></div>
    <div class="row"><button class="primary" id="bComenzar">${ic('play')} Comenzar</button><button id="bDatos">${ic('gear')} Datos</button></div>
    <p class="meta" style="text-align:center;margin-top:24px">${VERSION}</p>`;
}

/* ---------- SESIONES ---------- */
function vistaSesiones(){
  const items=SES.map(s=>{
    const n=filtrarPara(s).length;
    return `<div class="card">
      <b>${esc(s.nombre)}</b><br><span class="meta">${esc(resumenFiltro(s))} · ${n} preguntas</span><br>
      <span class="meta">Hechas: ${s.hechas||0} · ✓ ${s.aciertos||0} · ✗ ${s.fallos||0}</span>
      <div class="row" style="margin-top:8px"><button class="primary small" data-abrir="${s.id}">Abrir</button>
      <button class="small" data-editar-ses="${s.id}">Configurar</button>
      <button class="small danger" data-borrar-ses="${s.id}">Borrar</button></div></div>`;
  }).join('');
  return `<div class="row" style="margin-bottom:10px"><button class="primary" id="bNueva">${ic('plus')} Nueva sesión</button>
    <button class="small" id="bVolver">← Inicio</button></div>
    ${items||'<p class="meta">Aún no tienes sesiones. Crea una para empezar.</p>'}`;
}
function vistaSesion(){
  const s=sesionById(actual); if(!s){go('sesiones');return '';}
  const n=filtrarPara(s).length;
  return `<div class="card"><b>${esc(s.nombre)}</b><br><span class="meta">${esc(resumenFiltro(s))} · ${n} preguntas</span>
    <p class="meta" style="margin-bottom:0">Hechas: ${s.hechas||0} · ✓ ${s.aciertos||0} · ✗ ${s.fallos||0}</p></div>
    <div class="row">
      <button class="primary" id="bOrden" ${n?'':'disabled'}>Practicar en orden</button>
      <button id="bMezcla" ${n?'':'disabled'}>${ic('shuffle')} Mezclar</button>
      <button id="bLista">${ic('list')} Ver y editar</button>
      <button id="bNuevaP">${ic('plus')} Pregunta</button>
    </div>
    <div class="row" style="margin-top:12px"><button class="small" id="bVolverS">← Sesiones</button></div>`;
}
function vistaForm(){
  const f=form;
  const cv=convs().map(c=>`<option value="${esc(c)}" ${f.conv===c?'selected':''}>${esc(c)}</option>`).join('');
  const tm=temasDe(f.conv).map(t=>`<option value="${t}" ${String(f.tema)===String(t)?'selected':''}>Tema ${t}</option>`).join('');
  return `<div class="card">
    <label>Nombre de la sesión</label><input type="text" id="fNom" value="${esc(f.nombre)}" placeholder="Ej: Auxiliar - temas 1 a 10">
    <label>Convocatoria</label><select id="fConv"><option value="all">Todas</option>${cv}</select>
    <label>Tema</label><select id="fTema"><option value="all">Todos</option>${tm}</select>
    <label class="row" style="margin-top:12px;color:var(--txt)"><input type="checkbox" id="fLimp" ${f.limpias?'checked':''} style="width:auto"> Solo preguntas revisadas</label>
    <p class="meta">${filtrarParaTemp(f).length} preguntas en esta sesión</p>
  </div>
  <div class="row"><button class="primary" id="bGuardarS">Guardar</button><button id="bCancelS">Cancelar</button></div>`;
}
function filtrarParaTemp(f){return filtrarPara(f);}

/* ---------- PRÁCTICA ---------- */
function ic(n){
  const p={
    edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/>',
    trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    back:'<path d="M15 6l-6 6 6 6"/>',
    play:'<path d="M8 5v14l11-7z"/>',
    shuffle:'<path d="M4 7h3l10 10h3M4 17h3l3-3M14 7h6M17 4l3 3-3 3"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
    repeat:'<path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2M20 4v5h-5M4 20v-5h5"/>'
  }[n]||'';
  return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
function anillo(pct,tam){
  const r=tam/2-5, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg class="ring" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}"><circle cx="${tam/2}" cy="${tam/2}" r="${r}" class="ring-bg"/><circle cx="${tam/2}" cy="${tam/2}" r="${r}" class="ring-fg" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${tam/2} ${tam/2})"/></svg>`;
}
function vistaPractica(){
  if(!sess) {go('sesiones'); return '';}
  if(sess.i>=sess.ids.length) return vistaFin();
  const q=byId(sess.ids[sess.i]);
  if(!q){sess.i++; return vistaPractica();}
  const e=estado(q);
  const n=sess.ids.length;
  const pctHechas=Math.round((sess.i/n)*100);
  const enter=sess.enter?' enter':''; sess.enter=false;
  const opts=q.opciones.map(o=>{
    let cls='opt';
    if(sess.resp!==null){
      if(q.correcta===o.letra) cls+=' ok';
      else if(sess.resp===o.letra) cls+=' ko';
    }
    return `<button class="${cls}" data-letra="${esc(o.letra)}" ${sess.resp!==null?'disabled':''}><b>${esc(o.letra)})</b> ${esc(o.texto)}</button>`;
  }).join('');
  let aviso='';
  if(sess.resp!==null && q.correcta){
    const ok=sess.resp===q.correcta;
    aviso=`<div class="feedback ${ok?'good':'bad'}">${ok?'✓ Correcto':'✗ Incorrecto. La respuesta es '+esc(q.correcta)}</div>`;
  }
  let pie='';
  if(sess.resp!==null){
    if(!q.correcta){
      pie=`<div class="card" style="background:var(--warnbg)"><p>Sin respuesta marcada. ¿Marcar <b>${esc(sess.resp)}</b> como correcta?</p>
        <div class="row"><button class="primary small" id="bSetOk">Sí, marcar</button><button class="small" id="bNoSet">No</button></div></div>`;
    }
    pie+=`<div class="row" style="margin-top:8px"><button class="primary" id="bSig">${sess.i+1<n?'Siguiente':'Ver resultado'}</button></div>`;
  }
  return `
  <div class="pr-top card">
    ${anillo(pctHechas,64)}
    <div class="pr-txt">
      <div class="pr-count">${sess.i+1}<span>/${n}</span></div>
      <div class="meta">✓ ${sess.ac} &nbsp; ✗ ${sess.fa}</div>
    </div>
    <div class="pr-badges"><span class="badge">Tema ${esc(q.tema)}</span><span class="badge ${e.c}">${e.t}</span></div>
  </div>
  <div class="card qcard${enter}">
    <p class="enun">${esc(q.enunciado)}</p>${opts}${aviso}${pie}
  </div>
  <div class="row">
    <button class="small" id="bEditP">${ic('edit')} Editar</button>
    <button class="small" id="bSalir">${ic('x')} Salir</button>
  </div>`;
}
function vistaFin(){
  const tot=sess.ac+sess.fa, pct=tot?Math.round(sess.ac/tot*100):0;
  const porTema={};
  sess.res.forEach(r=>{const q=byId(r.id); if(!q) return; const t=q.tema; porTema[t]=porTema[t]||{ok:0,tot:0}; porTema[t].tot++; if(r.ok) porTema[t].ok++;});
  const filas=Object.keys(porTema).sort((a,b)=>a-b).map(t=>{
    const x=porTema[t], p=Math.round(x.ok/x.tot*100);
    return `<div class="tema-row"><span>Tema ${t}</span><div class="bar"><div style="width:${p}%"></div></div><span class="meta">${x.ok}/${x.tot}</span></div>`;
  }).join('');
  const msg=pct>=80?'¡Muy bien!':pct>=50?'Buen trabajo, sigue así':'Toca repasar';
  return `<div class="card res">
      <div class="res-wrap">${anillo(pct,140).replace('class="ring"','class="ring big"')}<div class="res-pct">${pct}%</div></div>
      <p class="res-msg">${msg}</p>
      <p class="meta">${sess.ac} aciertos · ${sess.fa} fallos · ${tot} respondidas</p>
    </div>
    ${filas?`<div class="card"><label style="margin-top:0">Por tema</label>${filas}</div>`:''}
    <div class="row">
      ${sess.fa?`<button class="primary" id="bRepasar">${ic('repeat')} Repasar falladas (${sess.fa})</button>`:''}
      <button id="bSalir">${ic('back')} Volver a la sesión</button>
    </div>`;
}

/* ---------- EDICIÓN ---------- */

  const opts=d.opciones.map((o,i)=>`<div class="card" style="padding:10px">
      <div class="row" style="justify-content:space-between"><b>${esc(o.letra)})</b>
        <label class="row" style="margin:0;color:var(--txt)"><input type="radio" name="corr" value="${esc(o.letra)}" ${d.correcta===o.letra?'checked':''} style="width:auto"> Correcta</label></div>
      <textarea data-opt="${i}">${esc(o.texto)}</textarea></div>`).join('');
  return `<div class="card">
    <div class="row"><span class="badge">${esc(d.convocatoria||'')}</span><span class="badge">Tema ${esc(d.tema)}</span><span class="badge">nº ${esc(d.numero)}</span></div>
    <label>Enunciado</label><textarea id="eEnun">${esc(d.enunciado)}</textarea></div>
  ${opts}
  <div class="card row">
    <button id="bAddOpt" class="small">+ Opción</button>
    <button id="bDelOpt" class="small" ${d.opciones.length<=2?'disabled':''}>− Última opción</button>

  <div class="card row">
    <button class="primary" id="bGuardarE">Guardar</button>
    <button id="bCancelE">Cancelar</button>

function abrirEditor(id,back){
  const q=byId(id);
  editing={id,back,data:JSON.parse(JSON.stringify(q))};
  view='edit'; render();
}
function leerEdicion(){
  const d=editing.data;
  d.enunciado=document.getElementById('eEnun').value;
  document.querySelectorAll('[data-opt]').forEach(t=>{d.opciones[+t.dataset.opt].texto=t.value;});
  const r=document.querySelector('input[name=corr]:checked');
  d.correcta=r?r.value:null;
  return d;
}
function nuevaPregunta(){
  const n=Math.max(0,...Q.filter(q=>q.convocatoria==='Manual').map(q=>q.numero))+1;
  const p={id:nuevoId('m'),convocatoria:'Manual',plaza:'',tema:0,numero:n,enunciado:'',
    opciones:['a','b','c','d'].map(l=>({letra:l,texto:''})),correcta:null,pagina:null,revisar:[],editada:true};
  Q.push(p); saveQ(); return p.id;
}

function vistaDatos(){
  return `<div class="card"><p>${Q.length} preguntas guardadas.</p>

    <button class="small" id="bVolverD">← Inicio</button></div>`;
}
function vistaRevision(){
  if(!importacion){go('datos');return '';}
  const P=importacion.preguntas;
  const conRes=P.filter(q=>q.correcta).length;
  const revisar=P.filter(q=>q.revisar.length).length;
  const porConv={};
  P.forEach(q=>{porConv[q.convocatoria]=(porConv[q.convocatoria]||0)+1;});
  const lista=Object.entries(porConv).map(([c,n])=>`<li>${esc(c)}: <b>${n}</b></li>`).join('');
  const muestra=P.slice(0,2).map(q=>`<div class="card" style="margin:8px 0"><span class="meta">T${esc(q.tema)} · nº ${esc(q.numero)}</span><p style="margin:4px 0"><b>${esc(q.enunciado).slice(0,160)}</b></p>
    <span class="meta">${q.opciones.length} opciones · correcta: ${esc(q.correcta||'no marcada')}</span></div>`).join('');
  const hayActuales=Q.length>0;
  return `<div class="card">
      <p><b>${P.length}</b> preguntas detectadas en ${importacion.paginas} páginas.</p>
      <p class="meta">${conRes} con respuesta marcada · ${P.length-conRes} sin respuesta · ${revisar} con avisos</p>
      <ul class="meta">${lista}</ul>
      ${importacion.avisos.length?`<p class="meta" style="color:var(--warn)">${importacion.avisos.map(esc).join('<br>')}</p>`:''}
    </div>
    <div class="card"><label style="margin-top:0">Muestra</label>${muestra}</div>
    <div class="row">
      ${hayActuales?`<button class="primary" id="bRevAdd">Añadir a las ${Q.length} actuales</button><button class="danger" id="bRevRep">Reemplazar las actuales</button>`:`<button class="primary" id="bRevAdd">Guardar ${P.length} preguntas</button>`}
      <button id="bRevCancel">Cancelar</button>
    </div>`;
}

/* ---------- IMPORTACIÓN PDF ---------- */
let importacion=null;
const RE_Q1=/^(\d+)\.(\d+)\.\s+(.*)$/, RE_Q2=/^Tema\s*(\d+)\s*[-–]\s*Pregunta\s*(\d+)\s*\.?\s*[-–]?\s*(.*)$/;
const RE_TEMA=/^Tema\s*(\d+)\.\s/, RE_OPT=/^([a-d])\)\s?(.*)$/, RE_PLAZA=/PLAZA DE (.*)/;
const RUIDO=[/^Pl\. España/,/^\d+ de \d+$/,/^CONVOCATORIA/,/^\d+$/,/^Normativa:/,/^Preguntas tema/,/^Heredia Herrera/,/^MATERIAS ESPEC/,/^Bibliograf/];
function esRojo(c){
  if(!c) return false;
  if(typeof c==='string'){ const m=c.match(/^#?([0-9a-f]{6})$/i); if(!m) return false; const v=parseInt(m[1],16); return (v>>16)>230 && ((v>>8)&255)<30 && (v&255)<30; }
  if(Array.isArray(c)&&c.length===3){ const [r,g,b]=c.map(x=>x<=1?x*255:x); return r>230&&g<30&&b<30; }
  return false;
}
async function extraerPDF(file, progreso){
  const buf=await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const OPS=pdfjsLib.OPS;
  const lineas=[]; const avisos=[]; let paginas=0;
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const ops=await page.getOperatorList();
    const tc=await page.getTextContent({disableCombineTextItems:true});
    // color de relleno asociado a cada operación de texto, en orden
    let fill=null; const colores=[];
    for(let k=0;k<ops.fnArray.length;k++){
      const fn=ops.fnArray[k], a=ops.argsArray[k];
      if(fn===OPS.setFillRGBColor) fill=a;
      else if(fn===OPS.setFillColor && a && a.length===3) fill=a;
      else if(fn===OPS.setFillGray) fill=[a[0],a[0],a[0]];
      else if(fn===OPS.showText||fn===OPS.showSpacedText) colores.push(esRojo(fill));
    }
    const items=tc.items;
    const alineado=items.length===colores.length;
    if(!alineado) avisos.push(`Página ${p}: no se pudo leer el color; sus respuestas quedan sin marcar.`);
    const cajas=items.map((it,k)=>({str:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,rojo:alineado&&colores[k]}));
    // agrupar en líneas por altura
    const ordenados=cajas.filter(c=>c.str.trim()!=='').sort((a,b)=>b.y-a.y);
    const grupos=[];
    for(const c of ordenados){
      const g=grupos[grupos.length-1];
      if(g && Math.abs(c.y-g.y)<=2.5) g.items.push(c); else grupos.push({y:c.y,items:[c]});
    }
    let finAnexo=false;
    for(const g of grupos){
      g.items.sort((a,b)=>a.x-b.x);
      let texto='', nr=0, nt=0, prev=null;
      for(const c of g.items){
        if(prev && c.x-(prev.x+prev.w)>1.5 && !texto.endsWith(' ')) texto+=' ';
        texto+=c.str; prev=c;
        nt+=c.str.length; if(c.rojo) nr+=c.str.length;
      }
      texto=texto.replace(/\s+/g,' ').trim();
      if(texto==='ANEXO'){ finAnexo=true; break; }
      lineas.push({pg:p,t:texto,nr,nt});
    }
    paginas=p;
    if(finAnexo){ paginas=p-1; break; }
    if(p%20===0 && progreso) progreso(`Leyendo página ${p} de ${pdf.numPages}…`);
    if(p%20===0) await new Promise(r=>setTimeout(r,0));
  }
  if(progreso) progreso('Detectando preguntas…');
  const preguntas=analizarLineas(lineas);
  return {preguntas,paginas,avisos};
}
function analizarLineas(lineas){
  const out=[]; let cur=null, state='out', bloque=0, plaza=null, bufPlaza=null;
  const cerrar=()=>{ if(cur) out.push(cur); cur=null; };
  for(const L of lineas){
    const t=L.t; if(!t) continue;
    if(t.startsWith('UNA PLAZA DE')){ cerrar(); state='out'; bloque++; plaza=t.replace('UNA PLAZA DE','').trim(); continue; }
    const mp=t.match(RE_PLAZA); if(mp) bufPlaza=mp[1];
    if(t.startsWith('MATERIAS COMUNES')){ cerrar(); state='out'; continue; }
    if(RUIDO.some(r=>r.test(t))) continue;
    const mt=t.match(RE_TEMA); if(mt){ cerrar(); state='out'; continue; }
    const m1=t.match(RE_Q1), m2=t.match(RE_Q2);
    if(m1||m2){
      cerrar(); state='q';
      const m=m1||m2;
      cur={convocatoria:'Convocatoria '+bloque,plaza:plaza||bufPlaza||'',tema:+m[1],numero:+(m1?m[2]:m[2]),enunciado:m[3],opciones:[],pagina:L.pg,_r:0,_t:0};
      continue;
    }
    if(!cur || state==='out') continue;
    const mo=t.match(RE_OPT);
    if(mo){ state='o'; cur.opciones.push({letra:mo[1],texto:mo[2],_r:L.nr,_t:L.nt}); continue; }
    if(state==='q') cur.enunciado+=' '+t;
    else { const o=cur.opciones[cur.opciones.length-1]; if(o){ o.texto+=' '+t; o._r+=L.nr; o._t+=L.nt; } }
  }
  cerrar();
  return out.map((q,i)=>{
    const rojas=q.opciones.filter(o=>o._t&&o._r/o._t>0.5).map(o=>o.letra);
    const res={id:nuevoId('p'),convocatoria:q.convocatoria,plaza:q.plaza,tema:q.tema,numero:q.numero,
      enunciado:q.enunciado.trim(),opciones:q.opciones.map(o=>({letra:o.letra,texto:o.texto.trim()})),
      correcta:rojas.length===1?rojas[0]:null,pagina:q.pagina,revisar:[],editada:false};
    const motivos=[];
    if(res.opciones.length!==4) motivos.push('opciones');
    if(res.opciones.some(o=>o.texto.length<2)) motivos.push('opcion_vacia');
    if(res.opciones.some(o=>o.texto.length>300)) motivos.push('opcion_larga');
    if(!res.correcta) motivos.push('sin_correcta');
    res.revisar=motivos;
    return res;
  });
}
function guardarImportacion(modo){
  const nuevas=importacion.preguntas;
  Q = modo==='rep' ? nuevas : Q.concat(nuevas);
  saveQ(); importacion=null; go('home');
}

/* ---------- EVENTOS ---------- */
function bind(){
  const $=id=>document.getElementById(id);
  const on=(id,fn)=>{const el=$(id); if(el) el.onclick=fn;};
  const fi=$('fileIn'); if(fi) fi.onchange=e=>importar(e.target.files[0]);
  const pi=$('pdfIn'); if(pi) pi.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const est=$('pdfEstado'); est.textContent='Leyendo PDF…';
    try{
      importacion=await extraerPDF(f,m=>{ const x=$('pdfEstado'); if(x) x.textContent=m; });
      go('revisar');
    }catch(err){ est.textContent='No se pudo leer el PDF: '+err.message; }
  };
  on('bRevAdd',()=>guardarImportacion('add'));
  on('bRevRep',()=>{ if(confirm('¿Reemplazar las preguntas actuales por las del PDF? Se perderán tus ediciones.')) guardarImportacion('rep'); });
  on('bRevCancel',()=>{importacion=null; go('datos');});

  on('bComenzar',()=>go('sesiones'));
  on('bDatos',()=>go('datos'));
  on('bVolverD',()=>go('home'));
  on('bExp',exportar);
  on('bReset',()=>{ if(confirm('¿Borrar todas las preguntas, sesiones y cambios?')){Q=[];SES=[];saveQ();saveS();go('home');} });

  on('bNueva',()=>{form={id:null,nombre:'',conv:'all',tema:'all',limpias:false}; go('form');});
  on('bVolver',()=>go('home'));
  document.querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>{actual=b.dataset.abrir; go('sesion');});
  document.querySelectorAll('[data-editar-ses]').forEach(b=>b.onclick=()=>{const s=sesionById(b.dataset.editarSes); form={...s}; actual=s.id; go('form');});
  document.querySelectorAll('[data-borrar-ses]').forEach(b=>b.onclick=()=>{
    const s=sesionById(b.dataset.borrarSes);
    if(confirm(`¿Borrar la sesión "${s.nombre}"? Las preguntas no se borran.`)){SES=SES.filter(x=>x.id!==s.id);saveS();render();}
  });

  // formulario de sesión
  if(view==='form'){
    const fc=$('fConv'); if(fc) fc.onchange=e=>{form.conv=e.target.value; form.tema='all'; form.nombre=$('fNom').value; render();};
    const ft=$('fTema'); if(ft) ft.onchange=e=>{form.tema=e.target.value; form.nombre=$('fNom').value; render();};
    const fl=$('fLimp'); if(fl) fl.onchange=e=>{form.limpias=e.target.checked; form.nombre=$('fNom').value; render();};
    on('bCancelS',()=>go('sesiones'));
    on('bGuardarS',()=>{
      const nombre=$('fNom').value.trim()||'Sesión sin nombre';
      const datos={nombre,conv:$('fConv').value,tema:$('fTema').value,limpias:$('fLimp').checked};
      if(form.id){ Object.assign(sesionById(form.id),datos); }
      else { SES.push({id:nuevoId('s'),...datos,hechas:0,aciertos:0,fallos:0}); }
      saveS(); go('sesiones');
    });
  }

  // sesión
  on('bVolverS',()=>go('sesiones'));
  on('bOrden',()=>iniciar(false));
  on('bMezcla',()=>iniciar(true));
  on('bLista',()=>go('list'));
  on('bNuevaP',()=>{const id=nuevaPregunta(); abrirEditor(id,'sesion');});

  // práctica
  document.querySelectorAll('[data-letra]').forEach(b=>b.onclick=()=>responder(b.dataset.letra));
  on('bSig',siguiente);
  on('bSetOk',()=>{const q=byId(sess.ids[sess.i]); q.correcta=sess.resp; q.editada=true; q.revisar=[]; saveQ(); sess.ac++; sess.res.push({id:q.id,ok:true}); render();});
  on('bNoSet',()=>render());
  on('bEditP',()=>abrirEditor(sess.ids[sess.i],'practice'));
  on('bSalir',()=>{cerrarSesionPractica(); go('sesion');});
  on('bRepasar',()=>{
    const falladas=sess.res.filter(r=>!r.ok).map(r=>r.id);
    cerrarSesionPractica();
    sess={ids:falladas,i:0,ac:0,fa:0,resp:null,guardada:false,res:[],enter:false};
    go('practice');
  });

  // edición
  if(view==='edit'){
    on('bAddOpt',()=>{leerEdicion(); const d=editing.data; d.opciones.push({letra:String.fromCharCode(97+d.opciones.length),texto:''}); render();});
    on('bDelOpt',()=>{leerEdicion(); const d=editing.data; if(d.opciones.length>2) d.opciones.pop(); if(!d.opciones.find(o=>o.letra===d.correcta)) d.correcta=null; render();});
    on('bNoCorr',()=>{leerEdicion(); editing.data.correcta=null; render();});
    on('bGuardarE',()=>{
      const d=leerEdicion(); d.editada=true; d.revisar=[];
      const i=Q.findIndex(q=>q.id===d.id); if(i>=0) Q[i]=d; else Q.push(d);
      saveQ();
      const b=editing.back; editing=null;
      if(b==='practice' && sess){ sess.resp=null; go('practice'); }
      else if(b==='list') go('list');
      else go('sesion');
    });
    on('bCancelE',()=>{const b=editing.back; editing=null; if(b==='practice'&&sess) go('practice'); else if(b==='list') go('list'); else go('sesion');});
    on('bDelQ',()=>{
      if(!confirm('¿Eliminar esta pregunta?')) return;
      const id=editing.id, b=editing.back;
      Q=Q.filter(q=>q.id!==id); saveQ(); editing=null;
      if(sess) sess.ids=sess.ids.filter(x=>x!==id);
      if(b==='practice'&&sess&&sess.ids.length) go('practice'); else go(b==='list'?'list':'sesion');
    });
  }

  // lista
  on('bVolverL',()=>go('sesion'));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>abrirEditor(b.dataset.edit,'list'));
}

/* ---------- ACCIONES ---------- */
function iniciar(mezclar){
  const s=sesionById(actual); if(!s) return;
  let ids=filtrarPara(s).map(q=>q.id);
  if(mezclar) ids=ids.sort(()=>Math.random()-0.5);
  if(!ids.length) return;
  sess={ids,i:0,ac:0,fa:0,resp:null,guardada:false,res:[],enter:false};
  go('practice');
}
function responder(letra){
  if(sess.resp!==null) return;
  const q=byId(sess.ids[sess.i]);
  sess.resp=letra;
  if(q.correcta){ const ok=letra===q.correcta; if(ok) sess.ac++; else sess.fa++; sess.res.push({id:q.id,ok}); }
  render();
}
function siguiente(){
  sess.i++; sess.resp=null; sess.enter=true;
  if(sess.i>=sess.ids.length) cerrarSesionPractica();
  render();
}
function cerrarSesionPractica(){
  if(sess && !sess.guardada){
    const s=sesionById(actual);
    if(s){ s.hechas=(s.hechas||0)+sess.i; s.aciertos=(s.aciertos||0)+sess.ac; s.fallos=(s.fallos||0)+sess.fa; saveS(); }
    sess.guardada=true;
  }
}
function importar(file){
  if(!file) return;
  file.text().then(t=>{
    const data=JSON.parse(t);
    if(!Array.isArray(data)) throw new Error('formato');
    Q=data.map(q=>({revisar:[],editada:false,...q}));
    saveQ(); go('home');
  }).catch(()=>alert('No se pudo leer el archivo. Debe ser el JSON de preguntas.'));
}
function exportar(){
  const blob=new Blob([JSON.stringify(Q,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='preguntas-copia.json';
  document.body.appendChild(a); a.click(); a.remove();
}

document.getElementById('btnInicio').onclick=()=>{cerrarSesionPractica(); sess=null; editing=null; go('home');};
load(); render();
</script>
