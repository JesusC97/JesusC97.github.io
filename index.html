<!DOCTYPE html>

<html lang="es" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="OpoTest" name="apple-mobile-web-app-title"/>
<title>OpoTest - Preparación de Oposiciones</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --bg:#f8fafc;
  --card:#ffffff;
  --card-elevated:#ffffff;
  --txt:#0f172a;
  --mut:#64748b;
  --line:#e2e8f0;
  --line-soft:#f1f5f9;
  
  --acc:#4f46e5;
  --acc-rgb:79,70,229;
  --acc2:#7c3aed;
  --acc-light:#eef2ff;
  --acc-glow:rgba(79,70,229,0.18);
  
  --ok:#10b981;
  --okbg:#ecfdf5;
  --okborder:#a7f3d0;
  
  --ko:#ef4444;
  --kobg:#fef2f2;
  --koborder:#fecaca;
  
  --warn:#f59e0b;
  --warnbg:#fffbeb;
  --warnborder:#fde68a;
  
  --shadow-sm:0 1px 2px rgba(15,23,42,0.04);
  --shadow:0 4px 16px -2px rgba(15,23,42,0.06), 0 2px 6px -1px rgba(15,23,42,0.04);
  --shadow-lg:0 12px 32px -4px rgba(79,70,229,0.14), 0 4px 12px -2px rgba(15,23,42,0.05);
  
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#090d16;
    --card:#111827;
    --card-elevated:#1e293b;
    --txt:#f1f5f9;
    --mut:#94a3b8;
    --line:#1f293d;
    --line-soft:#172033;
    
    --acc:#6366f1;
    --acc-rgb:99,102,241;
    --acc2:#8b5cf6;
    --acc-light:rgba(99,102,241,0.14);
    --acc-glow:rgba(99,102,241,0.25);
    
    --ok:#34d399;
    --okbg:#064e3b33;
    --okborder:#065f46;
    
    --ko:#f87171;
    --kobg:#7f1d1d33;
    --koborder:#991b1b;
    
    --warn:#fbbf24;
    --warnbg:#78350f33;
    --warnborder:#92400e;
    
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow:0 6px 20px rgba(0,0,0,0.35);
    --shadow-lg:0 16px 36px rgba(0,0,0,0.5);
  }
}

*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:var(--font-family);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* Ambient glow in background */
body::before{
  content:'';
  position:fixed;
  top:-120px;
  left:50%;
  transform:translateX(-50%);
  width:680px;
  height:360px;
  background:radial-gradient(circle, rgba(var(--acc-rgb), 0.10) 0%, rgba(var(--acc-rgb), 0) 70%);
  pointer-events:none;
  z-index:0;
}

/* Header */
header{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 10px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  transition:border-color .2s;
}
@media(prefers-color-scheme:dark){
  header{
    background:rgba(17,24,39,0.85);
  }
}

.brand-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
}
.brand-logo{
  width:36px;
  height:36px;
  border-radius:10px;
  box-shadow:0 2px 8px var(--acc-glow);
  object-fit:cover;
  transition:transform .2s ease;
}
.brand-wrap:hover .brand-logo{
  transform:scale(1.05) rotate(-2deg);
}
.brand-text{
  display:flex;
  flex-direction:column;
}
.brand-title{
  font-size:17px;
  font-weight:800;
  letter-spacing:-0.3px;
  line-height:1.15;
  background:linear-gradient(135deg, var(--txt), var(--acc));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.brand-tag{
  font-size:11px;
  font-weight:600;
  color:var(--mut);
  letter-spacing:0.1px;
}

/* Nav Actions */
.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.nav-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--txt);
  padding:7px 13px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .15s ease;
  box-shadow:var(--shadow-sm);
}
.nav-btn:hover{
  border-color:var(--acc);
  color:var(--acc);
  background:var(--acc-light);
  transform:translateY(-1px);
}

/* Main Container */
main{
  position:relative;
  z-index:1;
  padding:20px 16px;
  max-width:700px;
  margin:0 auto;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 54px);
  animation:fade .3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes fade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

/* Cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.card:hover{
  border-color:rgba(var(--acc-rgb),0.3);
}

/* Hero Card (Friendly Welcome) */
.hero-card{
  background:linear-gradient(145deg, var(--card) 0%, var(--acc-light) 100%);
  border:1px solid rgba(var(--acc-rgb), 0.22);
  border-radius:var(--radius-lg);
  padding:24px;
  position:relative;
  overflow:hidden;
}
.hero-content{
  display:flex;
  align-items:center;
  gap:18px;
}
.hero-logo-box{
  width:68px;
  height:68px;
  flex-shrink:0;
  border-radius:18px;
  padding:3px;
  background:linear-gradient(135deg, var(--acc), var(--acc2));
  box-shadow:var(--shadow-lg);
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero-logo-img{
  width:100%;
  height:100%;
  border-radius:15px;
  object-fit:cover;
}
.hero-title{
  font-size:20px;
  font-weight:800;
  margin:0 0 4px;
  letter-spacing:-0.4px;
  color:var(--txt);
}
.hero-desc{
  margin:0;
  color:var(--mut);
  font-size:13.5px;
  line-height:1.45;
}

/* Stats Row */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  margin-bottom:16px;
}
.stat-pill{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 12px;
  text-align:center;
  box-shadow:var(--shadow-sm);
  transition:transform .15s ease;
}
.stat-pill:hover{
  transform:translateY(-2px);
  border-color:var(--acc);
}
.stat-val{
  font-size:22px;
  font-weight:800;
  color:var(--txt);
  line-height:1.1;
}
.stat-label{
  font-size:11.5px;
  font-weight:600;
  color:var(--mut);
  margin-top:4px;
  text-transform:uppercase;
  letter-spacing:0.3px;
}

/* Buttons */
button, .btn{
  font-family:inherit;
  font-weight:600;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--txt);
  border-radius:14px;
  padding:12px 18px;
  cursor:pointer;
  min-height:46px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:14.5px;
  transition:all .16s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow:var(--shadow-sm);
  text-decoration:none;
}
button:active{
  transform:scale(0.97);
}
button.primary{
  background:linear-gradient(135deg, var(--acc), var(--acc2));
  border-color:transparent;
  color:#ffffff;
  box-shadow:0 6px 18px var(--acc-glow);
}
button.primary:hover{
  box-shadow:0 8px 22px rgba(var(--acc-rgb), 0.35);
  transform:translateY(-1px);
}
button.secondary{
  background:var(--acc-light);
  border-color:rgba(var(--acc-rgb),0.25);
  color:var(--acc);
}
button.secondary:hover{
  background:rgba(var(--acc-rgb),0.18);
}
button.danger{
  color:var(--ko);
  background:var(--kobg);
  border-color:var(--koborder);
}
button.danger:hover{
  background:var(--ko);
  color:#ffffff;
}
button.small{
  min-height:36px;
  padding:6px 12px;
  font-size:13px;
  border-radius:10px;
}
button:disabled{
  opacity:0.45;
  cursor:not-allowed;
  transform:none !important;
  box-shadow:none !important;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}
.row.stretch > *{
  flex:1;
}

/* Question Option Cards */
.opt{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:left;
  margin:10px 0;
  padding:14px 16px;
  white-space:normal;
  font-weight:500;
  border-radius:var(--radius);
  line-height:1.45;
  font-size:15px;
  border:1.5px solid var(--line);
  background:var(--card);
  transition:all .18s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow:var(--shadow-sm);
  position:relative;
}
.opt:not(:disabled):hover{
  border-color:var(--acc);
  background:var(--acc-light);
  transform:translateX(3px);
  box-shadow:0 4px 12px var(--acc-glow);
}
.opt-badge{
  display:flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:10px;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--acc);
  font-weight:800;
  font-size:14px;
  flex-shrink:0;
  transition:all .2s ease;
}
.opt:hover .opt-badge{
  background:var(--acc);
  color:#ffffff;
  border-color:var(--acc);
}
.opt-text{
  flex:1;
}

.opt.ok{
  background:var(--okbg);
  border-color:var(--ok);
  color:var(--txt);
  box-shadow:0 4px 14px rgba(16,185,129,0.18);
}
.opt.ok .opt-badge{
  background:var(--ok);
  color:#ffffff;
  border-color:var(--ok);
}
.opt.ko{
  background:var(--kobg);
  border-color:var(--ko);
  color:var(--txt);
  box-shadow:0 4px 14px rgba(239,68,68,0.18);
}
.opt.ko .opt-badge{
  background:var(--ko);
  color:#ffffff;
  border-color:var(--ko);
}

/* Practice Progress Header */
.pr-top{
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px 20px;
  border-radius:var(--radius);
  background:var(--card);
  box-shadow:var(--shadow);
}
.pr-txt{
  flex:1;
}
.pr-count{
  font-size:24px;
  font-weight:800;
  line-height:1;
  letter-spacing:-0.4px;
}
.pr-count span{
  font-size:15px;
  color:var(--mut);
  font-weight:600;
}
.pr-score-chips{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.ko{background:var(--kobg);color:var(--ko)}
.chip.theme{background:var(--acc-light);color:var(--acc)}

/* Badges */
.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11.5px;
  font-weight:700;
  border-radius:999px;
  padding:3px 9px;
  background:var(--line-soft);
  color:var(--mut);
  border:1px solid var(--line);
}
.badge.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnborder)}
.badge.ok{background:var(--okbg);color:var(--ok);border-color:var(--okborder)}
.badge.primary{background:var(--acc-light);color:var(--acc);border-color:rgba(var(--acc-rgb),0.3)}

/* Question Card */
.qcard{
  padding:24px 22px;
  border-radius:var(--radius-lg);
}
.qcard-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.enun{
  font-size:18px;
  font-weight:700;
  line-height:1.5;
  letter-spacing:-0.2px;
  margin:4px 0 16px;
  color:var(--txt);
}

/* Feedback Box */
.feedback{
  margin-top:14px;
  padding:14px 18px;
  border-radius:14px;
  font-weight:600;
  font-size:14.5px;
  display:flex;
  align-items:center;
  gap:10px;
  animation:pop .25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes pop{
  from{opacity:0;transform:scale(0.97)}
  to{opacity:1;transform:scale(1)}
}
.feedback.good{
  background:var(--okbg);
  color:var(--ok);
  border:1.5px solid var(--okborder);
}
.feedback.bad{
  background:var(--kobg);
  color:var(--ko);
  border:1.5px solid var(--koborder);
}

/* Progress Rings */
.ring-bg{fill:none;stroke:var(--line);stroke-width:8}
.ring-fg{fill:none;stroke:var(--acc);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring.big .ring-fg{stroke-width:12}
.ring.big .ring-bg{stroke-width:12}

/* Results view */
.res{
  text-align:center;
  padding:32px 20px;
  border-radius:var(--radius-lg);
}
.res-wrap{
  position:relative;
  width:148px;
  height:148px;
  margin:0 auto 12px;
}
.res-pct{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:800;
  letter-spacing:-1px;
}
.res-pct span{
  font-size:12px;
  font-weight:700;
  color:var(--mut);
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.res .res-msg{
  font-weight:800;
  margin:8px 0 4px;
  font-size:22px;
  letter-spacing:-0.3px;
}

/* Progress Bar */
.bar{
  height:8px;
  background:var(--line);
  border-radius:999px;
  overflow:hidden;
}
.bar div{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .4s ease;
}
.tema-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin:12px 0;
  font-size:13.5px;
}
.tema-row span:first-child{
  width:84px;
  font-weight:700;
  color:var(--txt);
}
.tema-row .bar{
  flex:1;
  margin:0;
}
.tema-row .meta{
  width:50px;
  text-align:right;
  font-weight:600;
}

/* Form inputs */
select, input[type=text], textarea{
  font-family:inherit;
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:var(--card);
  color:var(--txt);
  outline:none;
  font-size:14.5px;
  transition:all .15s ease;
}
select:focus, input:focus, textarea:focus{
  border-color:var(--acc);
  box-shadow:0 0 0 4px var(--acc-glow);
}
textarea{min-height:90px;resize:vertical}
label{
  display:block;
  margin:14px 0 6px;
  font-size:12.5px;
  font-weight:700;
  color:var(--mut);
  text-transform:uppercase;
  letter-spacing:0.4px;
}

/* Session Item Cards */
.session-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
  transition:all .18s ease;
}
.session-card:hover{
  border-color:rgba(var(--acc-rgb), 0.4);
  box-shadow:var(--shadow);
  transform:translateY(-1px);
}
.session-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.session-name{
  font-size:17px;
  font-weight:800;
  color:var(--txt);
}

.ico{width:18px;height:18px;vertical-align:-3px;margin-right:2px;flex-shrink:0}
.enter{animation:slide .32s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* Question list item */
.qitem{
  display:block;
  width:100%;
  text-align:left;
  margin:10px 0;
  padding:16px;
  font-weight:500;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--card);
  transition:all .15s ease;
}
.qitem:hover{
  border-color:var(--acc);
  background:var(--acc-light);
  transform:translateX(2px);
}

.meta{color:var(--mut);font-size:13px}
.footer-note{
  text-align:center;
  font-size:12px;
  color:var(--mut);
  margin-top:32px;
  letter-spacing:0.2px;
}
</style>
</head>

function saveQ(){try{localStorage.setItem(KQ,JSON.stringify(Q));}catch(e){}}

function load(){
  try{const q=localStorage.getItem(KQ); if(q) Q=JSON.parse(q);}catch(e){}

function byId(id){return Q.find(q=>q.id===id);}

function esLimpia(q){return !q.revisar || q.revisar.length===0;}
function estado(q){
  if(q.anulada) return {t:'Anulada',c:'warn'};
  if(q.editada) return {t:'Editada',c:''};
  if(!q.correcta) return {t:'Sin respuesta',c:'warn'};
  if(q.revisar&&q.revisar.length) return {t:'Revisar',c:'warn'};
  return {t:'Lista',c:'ok'};
}
function convs(){return [...new Set(Q.map(q=>q.convocatoria))];}
function temasDe(conv){return [...new Set(Q.filter(q=>conv==='all'||q.convocatoria===conv).map(q=>q.tema))].sort((a,b)=>a-b);}
function filtrarTodas(s){
  return Q.filter(q=>(s.conv==='all'||q.convocatoria===s.conv)
    &&(s.tema==='all'||String(q.tema)===String(s.tema))
    &&(!s.limpias||esLimpia(q)));
}
function filtrarPara(s){
  return Q.filter(q=>!q.anulada&&(s.conv==='all'||q.convocatoria===s.conv)
    &&(s.tema==='all'||String(q.tema)===String(s.tema))
    &&(!s.limpias||esLimpia(q)));
}
function resumenFiltro(s){
  const c=s.conv==='all'?'Todas las convocatorias':s.conv;
  const t=s.tema==='all'?'Todos los temas':'Tema '+s.tema;

}

}

function anillo(pct,tam){
  const r=tam/2-6, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg class="ring" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}">
    <circle cx="${tam/2}" cy="${tam/2}" r="${r}" class="ring-bg"/>
    <circle cx="${tam/2}" cy="${tam/2}" r="${r}" class="ring-fg" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${tam/2} ${tam/2})"/>
  </svg>`;
}

/* ---------- IMPORTACIÓN DE EXAMEN ---------- */
let importacion=null;
async function leerLineasPDF(file){
  const buf=await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const cajas=tc.items.filter(it=>it.str.trim()!=='').map(it=>({str:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0}));
    cajas.sort((a,b)=>b.y-a.y);
    const grupos=[];
    for(const c of cajas){ const g=grupos[grupos.length-1]; if(g&&Math.abs(c.y-g.y)<=2.5) g.items.push(c); else grupos.push({y:c.y,items:[c]}); }
    for(const g of grupos){
      g.items.sort((a,b)=>a.x-b.x);
      let t='', prev=null;
      for(const c of g.items){ if(prev&&c.x-(prev.x+prev.w)>1.5&&!t.endsWith(' ')) t+=' '; t+=c.str; prev=c; }
      out.push(t.replace(/\s+/g,' ').trim());
    }
    if(p%20===0) await new Promise(r=>setTimeout(r,0));
  }
  return out.filter(Boolean);
}
function leerPlantilla(lineas){
  const pares={}, conflictos=[];
  const re=/(?<!\d)(\d{1,3})\s+([A-D])(?![A-Za-zÁÉÍÓÚáéíóúñ])/g;
  for(const l of lineas){
    re.lastIndex=0; let m;
    while((m=re.exec(l))){
      const n=+m[1], letra=m[2];
      if(n<1||n>200) continue;
      if(pares[n]&&pares[n]!==letra){ if(!conflictos.includes(n)) conflictos.push(n); }
      else pares[n]=letra;
    }
  }
  return {pares,conflictos};
}
function leerCuestionario(lineas){
  const preguntas=[]; let cur=null, state='out', started=false, reserva=false;
  const cerrar=()=>{ if(cur){ preguntas.push(cur); cur=null; } };
  const RUIDO=[/^Excmo\. Ayuntamiento/,/^Servicio de Personal/,/^PRIMER EJERCICIO 2 PLAZAS/,/^ADMINISTRATIVO\/A PEPI/,/^\d+$/];
  for(const t of lineas){
    if(!started){ if(t==='PRIMER EJERCICIO') started=true; continue; }
    if(RUIDO.some(r=>r.test(t))) continue;
    if(t==='PREGUNTAS DE RESERVA'){ cerrar(); state='out'; reserva=true; continue; }
    if(/^(PRIMER|SEGUNDO)\s+(EJERCICIO|SUPUESTO)(\s+PRÁCTICO|\s+PRACTICO)?$/.test(t)){ cerrar(); state='out'; reserva=false; continue; }
    const mq=t.match(/^(\d{1,3})\.-\s*(.*)$/);
    if(mq){ cerrar(); state='q'; cur={numero:+mq[1],enunciado:mq[2],opciones:[],reserva}; continue; }
    if(!cur) continue;
    const mo=t.match(/^([a-d])\)\s*(.*)$/);
    if(mo){ state='o'; cur.opciones.push({letra:mo[1],texto:mo[2]}); continue; }
    if(state==='q') cur.enunciado+=' '+t;
    else if(state==='o'&&cur.opciones.length){ cur.opciones[cur.opciones.length-1].texto+=' '+t; }
  }
  cerrar();
  return preguntas;
}
function construirImportacion(lineasPreg, lineasPlan, nombre){
  const cuest=leerCuestionario(lineasPreg);
  if(!cuest.length) throw new Error('No se encontraron preguntas en el PDF de preguntas.');
  const {pares,conflictos}=leerPlantilla(lineasPlan);
  const avisos=[];
  if(conflictos.length) avisos.push('Números con dos respuestas distintas en la plantilla: '+conflictos.join(', ')+'.');
  const reservas=cuest.filter(q=>q.reserva).length;
  const ordinarias=cuest.filter(q=>!q.reserva);
  const sinRespuesta=ordinarias.filter(q=>!pares[q.numero]).map(q=>q.numero);
  if(sinRespuesta.length) avisos.push('Sin respuesta en la plantilla: '+sinRespuesta.join(', ')+'.');
  const preguntas=ordinarias.map(q=>{
    const opciones=q.opciones.map(o=>({letra:o.letra,texto:o.texto.trim()}));
    const correcta=pares[q.numero]?pares[q.numero].toLowerCase():null;
    const revisar=[];
    if(opciones.length!==4) revisar.push('opciones');
    if(!correcta) revisar.push('sin_correcta');
    if(conflictos.includes(q.numero)) revisar.push('conflicto');
    return {id:nuevoId('e'),convocatoria:nombre,plaza:'',tema:q.numero<=70?1:2,numero:q.numero,
      enunciado:q.enunciado.trim(),opciones,correcta,pagina:null,revisar,editada:false};
  });
  return {preguntas,avisos,resumen:`Examen: ${nombre}. ${reservas} preguntas de reserva detectadas.`};
}
async function procesarExamen(){
  const $=id=>document.getElementById(id);
  const fp=$('exPreg').files[0], fl=$('exPlan').files[0];
  if(!fp||!fl){ alert('Selecciona tanto el PDF de preguntas como el de la plantilla.'); return; }
  const nombre=$('exNombre').value.trim()||fp.name.replace(/\.pdf$/i,'');
  const est=$('pdfEstado');
  try{
    est.textContent='Leyendo preguntas del PDF…';
    const lp=await leerLineasPDF(fp);
    est.textContent='Analizando plantilla de respuestas oficiales…';
    const ll=await leerLineasPDF(fl);
    importacion=construirImportacion(lp,ll,nombre);
    go('revisar');
  }catch(err){ est.textContent='Error al procesar: '+err.message; }
}
function guardarImportacion(modo){
  const nuevas=importacion.preguntas;
  Q = modo==='rep' ? nuevas : Q.concat(nuevas);
  saveQ(); importacion=null; go('home');
}

  on('bVolverS',()=>go('sesiones'));
  on('bOrden',()=>iniciar(false));
  on('bMezcla',()=>iniciar(true));
  on('bLista',()=>go('list'));
  on('bNuevaP',()=>{const id=nuevaPregunta(); abrirEditor(id,'sesion');});

  // Práctica
  document.querySelectorAll('[data-letra]').forEach(b=>b.onclick=()=>responder(b.dataset.letra));
  on('bSig',siguiente);
  on('bSetOk',()=>{
    const q=byId(sess.ids[sess.i]);
    q.correcta=sess.resp; q.editada=true; q.revisar=[];
    saveQ(); sess.ac++; sess.res.push({id:q.id,ok:true}); render();
  });
  on('bNoSet',()=>render());
  on('bEditP',()=>abrirEditor(sess.ids[sess.i],'practice'));
  on('bSalir',()=>{cerrarSesionPractica(); go('sesion');});
  on('bRepasar',()=>{
    const falladas=sess.res.filter(r=>!r.ok).map(r=>r.id);
    cerrarSesionPractica();
    sess={ids:falladas,i:0,ac:0,fa:0,resp:null,guardada:false,res:[],enter:false};
    go('practice');
  });

  // Edición
  if(view==='edit'){
    on('bAddOpt',()=>{leerEdicion(); const d=editing.data; d.opciones.push({letra:String.fromCharCode(97+d.opciones.length),texto:''}); render();});
    on('bDelOpt',()=>{leerEdicion(); const d=editing.data; if(d.opciones.length>2) d.opciones.pop(); if(!d.opciones.find(o=>o.letra===d.correcta)) d.correcta=null; render();});
    on('bNoCorr',()=>{leerEdicion(); editing.data.correcta=null; render();});
    on('bGuardarE',()=>{
      const d=leerEdicion(); d.editada=true; d.revisar=[];
      const i=Q.findIndex(q=>q.id===d.id); if(i>=0) Q[i]=d; else Q.push(d);
      saveQ();
      const b=editing.back; editing=null;
      if(b==='practice'&&sess){ sess.resp=null; go('practice'); }
      else if(b==='list') go('list');
      else go('sesion');
    });
    on('bCancelE',()=>{const b=editing.back; editing=null; if(b==='practice'&&sess) go('practice'); else if(b==='list') go('list'); else go('sesion');});
    on('bDelQ',()=>{
      if(!confirm('¿Seguro que deseas eliminar esta pregunta?')) return;
      const id=editing.id, b=editing.back;
      Q=Q.filter(q=>q.id!==id); saveQ(); editing=null;
      if(sess) sess.ids=sess.ids.filter(x=>x!==id);
      if(b==='practice'&&sess&&sess.ids.length) go('practice'); else go(b==='list'?'list':'sesion');
    });
  }

  // Lista
  on('bVolverL',()=>go('sesion'));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>abrirEditor(b.dataset.edit,'list'));

  // Datos
  on('bExamen',procesarExamen);
  on('bExp',exportar);
  const fi=$('fileIn'); if(fi) fi.onchange=e=>importar(e.target.files[0]);
  on('bVolverD',()=>go('home'));
  on('bReset',()=>{
    if(confirm('¿Seguro que deseas borrar todas las preguntas, sesiones y estadísticas guardadas? Esta acción no se puede deshacer.')){
      Q=[]; SES=[]; saveQ(); saveS(); go('home');
    }
  });

  // Revisión importación
  on('bAplicarAnul',()=>{
    const nums=$('revAnul').value.split(/[,;\s]+/).map(x=>+x).filter(x=>x>0);
    importacion.preguntas.forEach(q=>{ q.anulada=nums.includes(q.numero); });
    render();
  });
  on('bRevAdd',()=>guardarImportacion('add'));
  on('bRevRep',()=>{
    if(confirm('¿Reemplazar todas las preguntas actuales por las de este examen?')) guardarImportacion('rep');
  });
  on('bRevCancel',()=>{importacion=null; go('datos');});
}

/* ---------- ACCIONES DE PRÁCTICA ---------- */
function iniciar(mezclar){
  const s=sesionById(actual); if(!s) return;
  let ids=filtrarPara(s).map(q=>q.id);
  if(mezclar) ids=ids.sort(()=>Math.random()-0.5);
  if(!ids.length) return;
  sess={ids,i:0,ac:0,fa:0,resp:null,guardada:false,res:[],enter:false};
  go('practice');
}
function responder(letra){
  if(sess.resp!==null) return;
  const q=byId(sess.ids[sess.i]);
  sess.resp=letra;
  if(q.correcta){
    const ok=letra===q.correcta;
    if(ok) sess.ac++; else sess.fa++;
    sess.res.push({id:q.id,ok});
  }
  render();
}
function siguiente(){
  sess.i++; sess.resp=null; sess.enter=true;
  if(sess.i>=sess.ids.length) cerrarSesionPractica();
  render();
}
function cerrarSesionPractica(){
  if(sess && !sess.guardada){
    const s=sesionById(actual);
    if(s){
      s.hechas=(s.hechas||0)+sess.i;
      s.aciertos=(s.aciertos||0)+sess.ac;
      s.fallos=(s.fallos||0)+sess.fa;
      saveS();
    }
    sess.guardada=true;
  }
}
function importar(file){
  if(!file) return;
  file.text().then(t=>{
    const data=JSON.parse(t);
    if(!Array.isArray(data)) throw new Error('Formato inválido');
    Q=data.map(q=>({revisar:[],editada:false,...q}));
    saveQ(); go('home');
  }).catch(()=>alert('No se pudo leer el archivo. Debe ser un JSON de preguntas válido.'));
}
function exportar(){
  const blob=new Blob([JSON.stringify(Q,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='oposiciones-preguntas.json';
  document.body.appendChild(a); a.click(); a.remove();
}

load();
render();
</script>
